name: ScarletX
run-name: ScarletX Build

# Keep source changes and version bumps in one commit so one logical update creates one build.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - experiment

concurrency:
  group: scarletx-build-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS_COMMIT: dd5c14bb9d91311e221d51b5bfb8c9e5948156db
  THEOS_CACHE_REV: v2
  THEOS_SDK: iPhoneOS15.6.sdk

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned Theos toolchain cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: theos
          key: scarletx-theos-${{ env.THEOS_COMMIT }}-${{ env.THEOS_SDK }}-${{ env.THEOS_CACHE_REV }}

      - name: Setup pinned lightweight Theos
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          if [ "${{ steps.theos-cache.outputs.cache-hit }}" != "true" ]; then
            git clone --filter=blob:none --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"
            git -C "$THEOS" checkout "$THEOS_COMMIT"
            git -C "$THEOS" submodule update --init --recursive --depth=1

            mkdir -p "$THEOS/sdks"
            git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
            git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set "$THEOS_SDK"
            cp -R "$RUNNER_TEMP/theos-sdks/$THEOS_SDK" "$THEOS/sdks/"
          fi

          ACTUAL_THEOS_COMMIT="$(git -C "$THEOS" rev-parse HEAD)"
          echo "Expected Theos: $THEOS_COMMIT"
          echo "Actual Theos:   $ACTUAL_THEOS_COMMIT"
          test "$ACTUAL_THEOS_COMMIT" = "$THEOS_COMMIT"
          test -d "$THEOS/sdks/$THEOS_SDK"

          if ! brew list make >/dev/null 2>&1; then
            brew install make
          fi
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi

          echo "Theos size:"
          du -sh "$THEOS"

      - name: Verify GNU Make
        shell: bash
        run: |
          set -euo pipefail
          make --version | head -n 1
          sysctl -n hw.logicalcpu

      - name: Build app in parallel
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find .theos/obj -type d -name 'ScarletX.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ScarletX.app was not found"
            find .theos -maxdepth 5 -type d -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ScarletX.app

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/ScarletX.app/Info.plist
          VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/ScarletX.app/Info.plist)"
          echo "App version: $VERSION"
          ditto -c -k --sequesterRsrc --keepParent Payload "ScarletX_v$VERSION.ipa"

          echo "Created:"
          ls -lh "ScarletX_v$VERSION.ipa"

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScarletX_v${{ steps.app_version.outputs.version }}
          path: ScarletX_v*.ipa
          if-no-files-found: error

      - name: Automatically publish successful develop build
        if: ${{ github.ref == 'refs/heads/develop' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.app_version.outputs.version }}"
          BUILD="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Resources/Info.plist)"
          TAG="v$VERSION"
          IPA="ScarletX_v$VERSION.ipa"
          test -f "$IPA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving existing release and source unchanged."
            exit 0
          fi
          gh release create "$TAG" "$IPA" --target "$GITHUB_SHA" --title "Scarlet X $TAG" --notes "Automatically published successful develop build $BUILD."
          python3 - "$VERSION" "$BUILD" "$IPA" "$TAG" <<'PY'
          import json, pathlib, sys, datetime
          version, build, ipa, tag = sys.argv[1:]
          repo = "Botanium-git/SCARLET-X"
          path = pathlib.Path("source.json")
          source = json.loads(path.read_text()) if path.exists() else {
              "name": "Scarlet X",
              "identifier": "com.scarletx.source",
              "sourceURL": f"https://raw.githubusercontent.com/{repo}/develop/source.json",
              "apps": [{
                  "name": "Scarlet X",
                  "bundleIdentifier": "com.scarletx",
                  "developerName": "Botanium-git",
                  "subtitle": "Scarlet X for LiveContainer",
                  "localizedDescription": "Scarlet X native X web wrapper",
                  "iconURL": "https://github.com/Botanium-git.png",
                  "tintColor": "D52B47",
                  "versions": []
              }]
          }
          app = source["apps"][0]
          app["versions"] = [v for v in app["versions"] if v.get("version") != version]
          app["versions"].insert(0, {
              "version": version,
              "buildVersion": build,
              "date": datetime.datetime.now(datetime.timezone.utc).date().isoformat(),
              "localizedDescription": "Successful develop build",
              "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/{ipa}",
              "size": pathlib.Path(ipa).stat().st_size,
              "minOSVersion": "15.0"
          })
          app["version"] = version
          app["downloadURL"] = app["versions"][0]["downloadURL"]
          path.write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Update approved Scarlet X source to $TAG [skip ci]"
          git pull --rebase origin develop
          git push origin HEAD:develop
