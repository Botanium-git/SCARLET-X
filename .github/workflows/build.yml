name: Build ScarletX IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          libgcuniversal: false
          altlist: false

      - name: Build app
        run: make clean all FINALPACKAGE=1

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find .theos/obj -type d -name 'ScarletX.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ScarletX.app was not found"
            find .theos -maxdepth 5 -type d -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ScarletX.app

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/ScarletX.app/Info.plist
          ditto -c -k --sequesterRsrc --keepParent Payload ScarletX-v0.1.0.ipa

          echo "Created:"
          ls -lh ScarletX-v0.1.0.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScarletX-v0.1.0
          path: ScarletX-v0.1.0.ipa
          if-no-files-found: error
