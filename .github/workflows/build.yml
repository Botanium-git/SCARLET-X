name: ScarletX
run-name: ScarletX Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# When several repository edits land in quick succession, keep only the
# newest build. This prevents one IPA build per intermediate commit.
concurrency:
  group: scarletx-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          libgcuniversal: false
          altlist: false

      - name: Build app
        run: make clean all FINALPACKAGE=1

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find .theos/obj -type d -name 'ScarletX.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ScarletX.app was not found"
            find .theos -maxdepth 5 -type d -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ScarletX.app

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/ScarletX.app/Info.plist
          VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/ScarletX.app/Info.plist)"
          echo "App version: $VERSION"
          ditto -c -k --sequesterRsrc --keepParent Payload "ScarletX-v$VERSION.ipa"

          echo "Created:"
          ls -lh "ScarletX-v$VERSION.ipa"

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScarletX-v${{ steps.app_version.outputs.version }}
          path: ScarletX-v*.ipa
          if-no-files-found: error
