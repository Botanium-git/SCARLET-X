name: ScarletX Speed Test
run-name: ScarletX Lightweight Theos + Parallel Build

on:
  workflow_dispatch:
  push:
    branches: [ "ci/theos-speed-test" ]

concurrency:
  group: scarletx-speed-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup lightweight Theos
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"

          mkdir -p "$THEOS/sdks"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS15.6.sdk
          cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS15.6.sdk" "$THEOS/sdks/"

          # Theos parallel builds require modern GNU Make. macOS ships an older make.
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi

          echo "Theos size:"
          du -sh "$THEOS"

      - name: Verify GNU Make
        shell: bash
        run: |
          set -euo pipefail
          make --version | head -n 1
          sysctl -n hw.logicalcpu

      - name: Build app in parallel
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find .theos/obj -type d -name 'ScarletX.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ScarletX.app was not found"
            find .theos -maxdepth 5 -type d -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ScarletX.app

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/ScarletX.app/Info.plist
          VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/ScarletX.app/Info.plist)"
          echo "App version: $VERSION"
          ditto -c -k --sequesterRsrc --keepParent Payload "ScarletX_v$VERSION.ipa"

          echo "Created:"
          ls -lh "ScarletX_v$VERSION.ipa"

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScarletX_speedtest_parallel_v${{ steps.app_version.outputs.version }}
          path: ScarletX_v*.ipa
          if-no-files-found: error
