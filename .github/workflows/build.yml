name: Build ScarletX IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          libgcuniversal: false
          altlist: false

      - name: Build
        run: make clean package FINALPACKAGE=1

      - name: Locate build output
        run: find . -type f \( -name "*.ipa" -o -name "*.deb" \) -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScarletX-v0.1.0
          path: |
            packages/*.ipa
            packages/*.deb
          if-no-files-found: error
